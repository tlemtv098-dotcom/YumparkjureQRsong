<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ขอเพลง - ร้านยำปากเจ่อ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Kanit", "sans-serif"]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white min-h-screen font-sans pb-24">
    <div class="max-w-sm sm:max-w-md md:max-w-lg lg:max-w-xl mx-auto px-4 sm:px-6 pt-6">
        <div class="flex items-center gap-3 mb-6">
            <img src="{% static 'music/img/logo.jpg' %}" class="w-12 h-12 sm:w-14 sm:h-14 object-cover rounded-xl ring-2 ring-amber-400/50 shadow-md">
            <div>
                <h1 class="font-extrabold text-lg sm:text-xl text-slate-900">ร้านยำปากเจ่อ</h1>
                <p class="text-xs sm:text-sm text-slate-500">สแกน QR เพื่อขอเพลง</p>
            </div>
        </div>

        <div id="now-playing-card" class="bg-amber-50 shadow-md border border-amber-200 rounded-2xl p-4 sm:p-5 mb-4">
            <h2 class="font-extrabold text-lg sm:text-xl text-slate-900 mb-2">เพลงถัดไปในคิว</h2>
            <div id="now-playing-content" class="text-sm text-slate-600">กำลังโหลด...</div>
        </div>

        <div id="result-panel" class="hidden sticky top-2 z-40 bg-green-50 border border-green-300 text-green-800 rounded-2xl p-3 sm:p-4 mb-4 shadow-md">
            <p id="result-text" class="font-bold text-sm"></p>
        </div>

        <div class="bg-slate-50 shadow-md border border-slate-200 rounded-2xl p-4 sm:p-5 mb-4">
            <h2 class="font-extrabold text-lg sm:text-xl text-slate-900 mb-3">ค้นหาเพลง</h2>
            <div class="flex gap-2 sm:gap-3 mb-3">
                <input type="text" id="searchInput" placeholder="พิมพ์ชื่อเพลงหรือศิลปิน..."
                       class="flex-1 min-w-0 border border-slate-300 bg-white text-slate-900 placeholder-slate-400 rounded-xl px-3 sm:px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
                <button onclick="searchSong()"
                        class="bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-white px-4 sm:px-5 py-3 rounded-xl font-bold text-sm shadow transition flex-shrink-0">
                    ค้นหา
                </button>
            </div>
            <p id="loading" class="hidden text-sm text-slate-500 text-center py-2">กำลังค้นหา...</p>
            <div id="results" class="space-y-2"></div>
        </div>

        <div class="bg-slate-50 shadow-md border border-slate-200 rounded-2xl p-4 sm:p-5 mb-4">
            <div class="flex items-center justify-between mb-3">
                <h2 class="font-extrabold text-lg sm:text-xl text-slate-900">เพลงฮิตแนะนำ</h2>
                <button id="refresh-hits" onclick="fetchHits()"
                        class="bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-white px-3 sm:px-4 py-2 rounded-xl font-bold text-xs sm:text-sm shadow transition">
                    รีเฟรชเพลง
                </button>
            </div>
            <div id="hit-list" class="space-y-2"></div>
        </div>

        <div class="bg-slate-50 shadow-md border border-slate-200 rounded-2xl p-4 sm:p-5 mb-4">
            <h2 class="font-extrabold text-lg sm:text-xl text-slate-900 mb-3">เพลงที่ฉันขอ</h2>
            <div id="my-songs-list" class="space-y-2"></div>
        </div>
    </div>

    <script>
        let clientId = localStorage.getItem("jukebox_client_id");
        if (!clientId) {
            clientId = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
            localStorage.setItem("jukebox_client_id", clientId);
        }

        // Known video IDs that have embedding disabled (Error 153)
        // Many Thai songs from GMM, etc. have embedding disabled
        const blockedVideoIds = new Set([
            "jNQXAC9IVRw",   // Me at the zoo
            "dQw4w9WgXcQ",   // Never Gonna Give You Up
            "qguo-j5PxBE",   // ซ่อน(ไม่)หา - Jeff Satur
            // Add more known blocked Thai songs here as discovered
        ]);

        let searchResults = [];
        let searchTimer = null;
        let hitSongs = [
            { id: "qguo-j5PxBE", title: "ซ่อน(ไม่)หา", channel: "Jeff Satur", thumbnail: "https://img.youtube.com/vi/qguo-j5PxBE/mqdefault.jpg" },
            { id: "ks7p6DA0dKk", title: "ข้างกัน", channel: "Three Man Down", thumbnail: "https://img.youtube.com/vi/ks7p6DA0dKk/mqdefault.jpg" },
            { id: "zwvv71slEYc", title: "ถ้าเธอ", channel: "Tilly Birds", thumbnail: "https://img.youtube.com/vi/zwvv71slEYc/mqdefault.jpg" },
            { id: "L1k0wkQ6uww", title: "แฟนเก่าคนโปรด", channel: "SLAPKISS", thumbnail: "https://img.youtube.com/vi/L1k0wkQ6uww/mqdefault.jpg" },
            { id: "yEbv0QiI1Ns", title: "คนไม่สำคัญ", channel: "GMM", thumbnail: "https://img.youtube.com/vi/yEbv0QiI1Ns/mqdefault.jpg" },
            { id: "s-MZid-59Hc", title: "แค่เธอ", channel: "Jeff Satur", thumbnail: "https://img.youtube.com/vi/s-MZid-59Hc/mqdefault.jpg" },
            { id: "rc7KnQAh_1I", title: "รักแรกพบ", channel: "Tattoo Colour", thumbnail: "https://img.youtube.com/vi/rc7KnQAh_1I/mqdefault.jpg" },
            { id: "I9ZIq7ynvdU", title: "แค่คนโทรผิด", channel: "GMM", thumbnail: "https://img.youtube.com/vi/I9ZIq7ynvdU/mqdefault.jpg" }
        ];

        function filterBlockedSongs(songs) {
            return songs.filter(song => !blockedVideoIds.has(song.id));
        }

        function renderHitList() {
            const container = document.getElementById("hit-list");
            container.innerHTML = "";
            const filteredHits = filterBlockedSongs(hitSongs);
            filteredHits.forEach((song, idx) => {
                container.innerHTML += `
                    <div class="bg-white shadow-md p-3 rounded-xl border border-slate-200 flex items-center gap-3">
                        <img src="${song.thumbnail}" class="w-12 h-12 object-cover rounded-lg flex-shrink-0">
                        <div class="flex-1 overflow-hidden">
                            <p class="font-semibold text-sm truncate text-slate-900">${song.title}</p>
                            <p class="text-xs text-slate-500 truncate">${song.channel}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="previewSong('${song.id}')" 
                                    class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded-lg font-bold text-xs shadow transition flex-shrink-0">
                                ฟังตัวอย่าง
                            </button>
                            <button onclick="requestHit(${hitSongs.indexOf(song)})"
                                    class="bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-white px-3 py-2 rounded-lg font-bold text-xs shadow transition flex-shrink-0">
                                ขอเพลง
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function fetchHits() {
            const btn = document.getElementById("refresh-hits");
            btn.disabled = true;
            btn.textContent = "กำลังโหลด...";
            fetch("/api/hits/")
                .then(res => res.json())
                .then(data => {
                    if (data.results && data.results.length > 0) {
                        hitSongs = filterBlockedSongs(data.results);
                        renderHitList();
                    }
                })
                .catch(err => console.error(err))
                .finally(() => {
                    btn.disabled = false;
                    btn.textContent = "รีเฟรชเพลง";
                });
        }

        function requestHit(idx) {
            const song = hitSongs[idx];
            requestSongData(song);
        }

        function searchSong() {
            const query = document.getElementById("searchInput").value.trim();
            if (!query) return;
            document.getElementById("loading").classList.remove("hidden");
            fetch("/api/search/?q=" + encodeURIComponent(query))
                .then(res => res.json())
                .then(data => {
                    document.getElementById("loading").classList.add("hidden");
                    searchResults = filterBlockedSongs(data.results);
                    const container = document.getElementById("results");
                    container.innerHTML = "";
                    if (searchResults.length === 0) {
                        container.innerHTML = "<p class="text-sm text-slate-500 text-center py-3">ไม่พบเพลงที่ค้นหา</p>";
                        return;
                    }
                    searchResults.forEach((song, idx) => {
                        container.innerHTML += `
                            <div class="bg-white shadow-md p-3 rounded-xl border border-slate-200 flex items-center gap-3">
                                <img src="${song.thumbnail}" class="w-12 h-12 object-cover rounded-lg flex-shrink-0">
                                <div class="flex-1 overflow-hidden">
                                    <p class="font-semibold text-sm truncate text-slate-900">${song.title}</p>
                                    <p class="text-xs text-slate-500 truncate">${song.channel}</p>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="previewSong('${song.id}')" 
                                            class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded-lg font-bold text-xs shadow transition flex-shrink-0">
                                        ฟังตัวอย่าง
                                    </button>
                                    <button onclick="requestSong(${idx})"
                                            class="bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-white px-3 py-2 rounded-lg font-bold text-xs shadow transition flex-shrink-0">
                                        ขอเพลง
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                })
                .catch(err => {
                    document.getElementById("loading").classList.add("hidden");
                    console.error(err);
                });
        }

        function requestSong(idx) {
            const song = searchResults[idx];
            requestSongData(song);
        }

        function previewSong(videoId) {
            // Open YouTube video in new tab for preview
            window.open("https://www.youtube.com/watch?v=" + videoId, "_blank");
        }

        function requestSongData(song) {
            fetch("/api/add/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    title: song.title,
                    video_id: song.id,
                    thumbnail: song.thumbnail,
                    channel: song.channel,
                    requested_by: "ลูกค้าในร้าน",
                    client_id: clientId
                })
            })
            .then(res => {
                if (!res.ok) {
                    return res.json().then(err => { throw new Error(err.error || "HTTP " + res.status); });
                }
                return res.json();
            })
            .then(data => {
                if (data.status === "success") {
                    showResult(data.song_id);
                    document.getElementById("searchInput").value = "";
                    document.getElementById("results").innerHTML = "";
                    fetchMySongs();
                } else {
                    alert("เพิ่มเพลงไม่สำเร็จ: " + (data.error || "Unknown error"));
                    console.error("Add song failed:", data);
                }
            })
            .catch(err => {
                console.error("Request error:", err);
                alert("เกิดข้อผิดพลาด: " + err.message);
            });
        }

        let mySongId = null;

        function showResult(songId) {
            mySongId = songId;
            document.getElementById("result-panel").classList.remove("hidden");
            updateMyStatus();
        }

        function updateMyStatus() {
            if (!mySongId) return;
            fetch("/api/queue/")
                .then(res => res.json())
                .then(data => {
                    const idx = data.queue.findIndex(s => s.id === mySongId);
                    const text = document.getElementById("result-text");
                    if (idx === -1) {
                        text.innerHTML = "เพลงของคุณเล่นแล้ว ขอบคุณที่ใช้บริการ!";
                        mySongId = null;
                    } else if (idx === 0) {
                        text.innerHTML = "กำลังเล่นเพลงของคุณ!";
                    } else {
                        text.innerHTML = "เพิ่มเพลงเข้าคิวแล้ว!<br>คิวของคุณ: ลำดับที่ " + (idx + 1);
                    }
                })
                .catch(err => console.error(err));
        }

        function fetchNowPlaying() {
            fetch("/api/queue/")
                .then(res => res.json())
                .then(data => {
                    const content = document.getElementById("now-playing-content");
                    if (data.queue && data.queue.length > 0) {
                        const song = data.queue[0];
                        content.innerHTML = `
                            <div class="flex items-center gap-3">
                                <img src="${song.thumbnail}" class="w-12 h-12 object-cover rounded-lg flex-shrink-0">
                                <div class="overflow-hidden">
                                    <p class="font-semibold text-sm truncate text-slate-900">${song.title}</p>
                                    <p class="text-xs text-slate-500 truncate">${song.channel}</p>
                                </div>
                            </div>
                        `;
                    } else {
                        content.textContent = "ไม่มีเพลงในคิว";
                    }
                })
                .catch(err => console.error(err));
        }

        function fetchMySongs() {
            fetch("/api/my-songs/?client_id=" + encodeURIComponent(clientId))
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById("my-songs-list");
                    if (!data.songs || data.songs.length === 0) {
                        container.innerHTML = "<p class="text-xs text-slate-400 text-center py-3">ยังไม่มีเพลงที่ขอไว้</p>";
                        return;
                    }
                    container.innerHTML = "";
                    data.songs.forEach(song => {
                        container.innerHTML += `
                            <div class="bg-white shadow-md p-3 rounded-xl border border-slate-200 flex items-center gap-3">
                                <img src="${song.thumbnail}" class="w-12 h-12 object-cover rounded-lg flex-shrink-0">
                                <div class="flex-1 overflow-hidden">
                                    <p class="font-semibold text-sm truncate text-slate-900">${song.title}</p>
                                    <p class="text-xs text-slate-500 truncate">${song.channel}</p>
                                </div>
                                <button onclick="removeMySong(${song.id})"
                                        class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-lg font-bold text-xs shadow transition flex-shrink-0">
                                    ลบ
                                </button>
                            </div>
                        `;
                    });
                })
                .catch(err => console.error(err));
        }

        function removeMySong(songId) {
            if (!confirm("ลบเพลงนี้ออกจากคิว?")) return;
            fetch("/api/my-songs/" + songId + "/delete/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ client_id: clientId })
            })
            .then(res => res.json())
            .then(data => {
                fetchMySongs();
                fetchNowPlaying();
            })
            .catch(err => console.error(err));
        }

        document.addEventListener("DOMContentLoaded", function () {
            renderHitList();
            fetchNowPlaying();
            fetchMySongs();
            fetchHits();
            setInterval(function () {
                fetchNowPlaying();
                fetchMySongs();
            }, 3000);
            setInterval(updateMyStatus, 3000);
            // Auto-refresh recommended songs every 60 seconds
            setInterval(fetchHits, 30000);
        });

        document.addEventListener("touchstart", function() {}, { once: true });
        document.addEventListener("click", function() {}, { once: true });

        const searchInput = document.getElementById("searchInput");
        searchInput.addEventListener("input", function () {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(searchSong, 500);
        });
    </script>
</body>
</html>
