<!DOCTYPE html>
{% load static %}
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ขอเพลง - ร้านยำปากเจ่อ</title>
    <link rel="manifest" href="{% static 'music/manifest.json' %}">
    <meta name="theme-color" content="#f59e0b">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link rel="apple-touch-icon" href="{% static 'music/img/logo.jpg' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Kanit", "sans-serif"]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen font-sans pb-24">
    <div class="max-w-sm sm:max-w-md md:max-w-lg lg:max-w-xl mx-auto px-4 sm:px-6 pt-6">
        <div class="flex items-center gap-3 mb-6">
            <img src="{% static 'music/img/logo.jpg' %}" class="w-12 h-12 sm:w-14 sm:h-14 object-cover rounded-xl ring-2 ring-amber-400/50 shadow-md">
            <div>
                <h1 class="font-extrabold text-lg sm:text-xl text-slate-900 dark:text-white">ร้านยำปากเจ่อ</h1>
                <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">สแกน QR เพื่อขอเพลง</p>
            </div>
            <button onclick="toggleTheme()" id="theme-toggle" class="ml-auto bg-slate-100 dark:bg-slate-700 p-2 rounded-lg" title="สลับโทน">🌙</button>
        </div>

        <div id="webview-banner" class="hidden bg-amber-100 border border-amber-300 text-amber-800 px-4 py-3 rounded-xl mb-4 flex items-center justify-between gap-3">
            <span class="text-sm font-medium">เปิดในเบราว์เซอร์ภายนอกเพื่อประสบการณ์ที่ดีขึ้น</span>
            <button onclick="window.open(location.href,'_blank')" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-1.5 rounded-lg text-sm font-bold flex-shrink-0">เปิดในเบราว์เซอร์ภายนอก</button>
        </div>

        <div id="now-playing-card" class="bg-amber-50 dark:bg-slate-800 shadow-md border border-amber-200 dark:border-slate-700 rounded-2xl p-4 sm:p-5 mb-4">
            <h2 class="font-extrabold text-lg sm:text-xl text-slate-900 dark:text-white mb-2">เพลงถัดไปในคิว</h2>
            <div id="now-playing-content" class="text-sm text-slate-600">กำลังโหลด...</div>
        </div>

        <div id="result-panel" class="hidden sticky top-2 z-40 bg-green-50 border border-green-300 text-green-800 rounded-2xl p-3 sm:p-4 mb-4 shadow-md">
            <p id="result-text" class="font-bold text-sm"></p>
        </div>

        <div class="bg-slate-50 dark:bg-slate-800 shadow-md border border-slate-200 dark:border-slate-700 rounded-2xl p-4 sm:p-5 mb-4">
            <h2 class="font-extrabold text-lg sm:text-xl text-slate-900 dark:text-white mb-3">ค้นหาเพลง</h2>
            <div class="flex gap-2 sm:gap-3 mb-1">
                <div class="relative flex-1 min-w-0">
                    <input type="text" id="searchInput" placeholder="พิมพ์ชื่อเพลงหรือศิลปิน..."
                           class="w-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-400 rounded-xl px-3 sm:px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
                    <div id="search-suggestions" class="hidden absolute left-0 right-0 top-full mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-lg z-50 max-h-48 overflow-y-auto"></div>
                </div>
                <button onclick="searchSong()"
                        class="bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-white px-4 sm:px-5 py-3 rounded-xl font-bold text-sm shadow transition flex-shrink-0">
                    ค้นหา
                </button>
            </div>
            <p id="loading" class="hidden text-sm text-slate-500 text-center py-2">กำลังค้นหาโปรดรอสักครู่</p>
            <div id="results" class="space-y-2"></div>
        </div>

        <div class="bg-slate-50 dark:bg-slate-800 shadow-md border border-slate-200 dark:border-slate-700 rounded-2xl p-4 sm:p-5 mb-4">
            <div class="flex items-center justify-between mb-3">
                <h2 class="font-extrabold text-lg sm:text-xl text-slate-900 dark:text-white">เพลงแนะนำ / เพลงฮิต</h2>
                <button id="refresh-hits" onclick="fetchHits()"
                        class="bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-white px-3 sm:px-4 py-2 rounded-xl font-bold text-xs sm:text-sm shadow transition">
                    รีเฟรชเพลง
                </button>
            </div>
            <div class="flex gap-1.5 mb-3 overflow-x-auto pb-1">
                <button onclick="fetchHits('')" data-genre="" class="genre-tab active bg-amber-500 text-white px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap">ทั้งหมด</button>
                <button onclick="fetchHits('pop')" data-genre="pop" class="genre-tab bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap">ป๊อป</button>
                <button onclick="fetchHits('rock')" data-genre="rock" class="genre-tab bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap">ร็อก</button>
                <button onclick="fetchHits('lukthung')" data-genre="lukthung" class="genre-tab bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap">ลูกทุ่ง</button>
                <button onclick="fetchHits('tiktok')" data-genre="tiktok" class="genre-tab bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap">TikTok</button>
            </div>
            <div id="hit-list" class="space-y-2"></div>
        </div>

        <div class="bg-slate-50 dark:bg-slate-800 shadow-md border border-slate-200 dark:border-slate-700 rounded-2xl p-4 sm:p-5 mb-4">
            <h2 class="font-extrabold text-lg sm:text-xl text-slate-900 dark:text-white mb-3">เพลงที่ฉันขอ</h2>
            <div id="my-songs-list" class="space-y-2"></div>
        </div>
    </div>

    <script>
        const isLineWebView = /Line\/|FBAN|FBAV|Messenger/i.test(navigator.userAgent);
        function getCSRFToken(){return document.querySelector('meta[name="csrf-token"]')?.getAttribute('content')||'';}
        function escapeHtml(str){if(!str) return ''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
        let clientId = localStorage.getItem("jukebox_client_id");
        if (!clientId) {
            clientId = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
            localStorage.setItem("jukebox_client_id", clientId);
        }

        // --- Toast ---
        function showToast(msg, type="info") {
            const t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg;
            t.className = "fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-4 py-2 rounded-xl shadow-lg text-sm font-medium";
            if (type === "error") t.className += " !bg-red-600";
            if (type === "success") t.className += " !bg-green-600";
            t.classList.remove('hidden');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.add('hidden'), 3000);
        }

        // Known video IDs that have embedding disabled (Error 153)
        // Many Thai songs from GMM, etc. have embedding disabled
        const blockedVideoIds = new Set([
            "jNQXAC9IVRw",   // Me at the zoo
            "dQw4w9WgXcQ",   // Never Gonna Give You Up
            "qguo-j5PxBE",   // ซ่อน(ไม่)หา - Jeff Satur
            // Add more known blocked Thai songs here as discovered
        ]);
        function isAlbumLike(t){return /longplay|รวมเพลง|ชั่วโมง|อัลบั้ม|60 minutes|playlist|ยาวๆ|ต่อเนื่อง/i.test(t||'');}

        let searchResults = [];
        let searchTimer = null;
        const searchInput = document.getElementById("searchInput");
        let hitSongs = [
            { id: "qguo-j5PxBE", title: "ซ่อน(ไม่)หา", channel: "Jeff Satur", thumbnail: "https://img.youtube.com/vi/qguo-j5PxBE/mqdefault.jpg", type: "hit" },
            { id: "ks7p6DA0dKk", title: "ข้างกัน", channel: "Three Man Down", thumbnail: "https://img.youtube.com/vi/ks7p6DA0dKk/mqdefault.jpg", type: "hit" },
            { id: "zwvv71slEYc", title: "ถ้าเธอ", channel: "Tilly Birds", thumbnail: "https://img.youtube.com/vi/zwvv71slEYc/mqdefault.jpg", type: "new" },
            { id: "L1k0wkQ6uww", title: "แฟนเก่าคนโปรด", channel: "SLAPKISS", thumbnail: "https://img.youtube.com/vi/L1k0wkQ6uww/mqdefault.jpg", type: "hit" },
            { id: "yEbv0QiI1Ns", title: "คนไม่สำคัญ", channel: "GMM", thumbnail: "https://img.youtube.com/vi/yEbv0QiI1Ns/mqdefault.jpg", type: "new" },
            { id: "s-MZid-59Hc", title: "แค่เธอ", channel: "Jeff Satur", thumbnail: "https://img.youtube.com/vi/s-MZid-59Hc/mqdefault.jpg", type: "hit" },
            { id: "rc7KnQAh_1I", title: "รักแรกพบ", channel: "Tattoo Colour", thumbnail: "https://img.youtube.com/vi/rc7KnQAh_1I/mqdefault.jpg", type: "new" },
            { id: "I9ZIq7ynvdU", title: "แค่คนโทรผิด", channel: "GMM", thumbnail: "https://img.youtube.com/vi/I9ZIq7ynvdU/mqdefault.jpg", type: "hit" }
        ];

        function filterBlockedSongs(songs) {
            return songs.filter(song => !blockedVideoIds.has(song.id) && !isAlbumLike(song.title));
        }

        function renderHitList() {
            const container = document.getElementById("hit-list");
            container.innerHTML = "";
            const hits = hitSongs;
            const filteredHits = filterBlockedSongs(hits);
            if (filteredHits.length === 0) {
                container.innerHTML = '<p class="text-sm text-slate-500 text-center py-4">ยังไม่มีเพลงแนะนำ กดรีเฟรชเพลงเพื่อลองใหม่</p>';
                return;
            }
            filteredHits.forEach((song, idx) => {
                const originalIdx = hitSongs.indexOf(song);
                container.innerHTML += `
                    <div class="bg-white dark:bg-slate-700 shadow-md p-3 rounded-xl border border-slate-200 dark:border-slate-600 flex items-center gap-3">
                        <img src="${song.thumbnail}" class="w-12 h-12 object-cover rounded-lg flex-shrink-0">
                        <div class="flex-1 overflow-hidden">
                            <div class="flex items-center gap-2 mb-1">
                                <p class="font-semibold text-sm truncate text-slate-900 dark:text-white">${escapeHtml(song.title)}</p>
                                <span class="bg-amber-100 text-amber-800 text-xs font-medium px-2 py-0.5 rounded-full flex-shrink-0">เพลงฮิต</span>
                            </div>
                            <p class="text-xs text-slate-500 dark:text-slate-300 truncate">${escapeHtml(song.channel)}</p>
                        </div>
                            <button onclick="requestHit(${originalIdx})"
                                    class="bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-white px-3 py-2 rounded-lg font-bold text-xs shadow transition flex-shrink-0">
                                ขอเพลง
                            </button>
                    </div>
                `;
            });
        }

        function fetchHits(genre) {
            if (genre === undefined) genre = currentGenre || "";
            currentGenre = genre;
            // update active tab styling
            document.querySelectorAll('.genre-tab').forEach(b => {
                if (b.dataset.genre === genre) { b.className = "genre-tab active bg-amber-500 text-white px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap"; }
                else { b.className = "genre-tab bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap"; }
            });
            const btn = document.getElementById("refresh-hits");
            if (btn) { btn.disabled = true; btn.textContent = "กำลังโหลด..."; }
            const url = genre ? "/api/hits/?genre=" + encodeURIComponent(genre) : "/api/hits/";
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data.results && data.results.length > 0) {
                        hitSongs = filterBlockedSongs(data.results);
                        renderHitList();
                    }
                })
                .catch(err => { console.error(err); showToast("โหลดเพลงแนะนำไม่สำเร็จ", "error"); })
                .finally(() => {
                    if (btn) { btn.disabled = false; btn.textContent = "รีเฟรชเพลง"; }
                });
        }
        let currentGenre = "";

        function requestHit(idx) {
            const song = hitSongs[idx];
            requestSongData(song);
        }

        function searchSong() {
            const query = document.getElementById("searchInput").value.trim();
            if (!query) return;
            document.getElementById("loading").classList.remove("hidden");
            fetch("/api/search/?q=" + encodeURIComponent(query))
                .then(res => res.json())
                .then(data => {
                    document.getElementById("loading").classList.add("hidden");
                    searchResults = filterBlockedSongs(data.results);
                    const container = document.getElementById("results");
                    container.innerHTML = "";
                    if (searchResults.length === 0) {
                        container.innerHTML = '<p class="text-sm text-slate-500 text-center py-3">ไม่พบเพลงที่เล่นได้ ลองคำค้นอื่น</p>';
                        return;
                    }
                    searchResults.forEach((song, idx) => {
                        container.innerHTML += `
                            <div class="bg-white dark:bg-slate-700 shadow-md p-3 rounded-xl border border-slate-200 dark:border-slate-600 flex items-center gap-3">
                                <img src="${song.thumbnail}" class="w-12 h-12 object-cover rounded-lg flex-shrink-0">
                                <div class="flex-1 overflow-hidden">
                                    <p class="font-semibold text-sm truncate text-slate-900 dark:text-white">${escapeHtml(song.title)}</p>
                                    <p class="text-xs text-slate-500 dark:text-slate-300 truncate">${escapeHtml(song.channel)}</p>
                                </div>
                                    <button onclick="requestSong(${idx})"
                                            class="bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-white px-3 py-2 rounded-lg font-bold text-xs shadow transition flex-shrink-0">
                                        ขอเพลง
                                    </button>
                            </div>
                        `;
                    });
                })
                .catch(err => {
                    document.getElementById("loading").classList.add("hidden");
                    console.error(err);
                    showToast("ค้นหาไม่สำเร็จ ลองใหม่นะ", "error");
                });
        }

        function requestSong(idx) {
            const song = searchResults[idx];
            requestSongData(song);
        }

        function requestSongData(song) {
            fetch("/api/add/", {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-CSRFToken": getCSRFToken() },
                credentials: 'same-origin',
                body: JSON.stringify({
                    title: song.title,
                    video_id: song.id,
                    thumbnail: song.thumbnail,
                    channel: song.channel,
                    requested_by: "ลูกค้าในร้าน",
                    client_id: clientId
                })
            })
            .then(res => {
                if (!res.ok) {
                    return res.json().then(err => { throw new Error(err.error || "HTTP " + res.status); });
                }
                return res.json();
            })
            .then(data => {
                if (data.status === "success") {
                    showResult(data.song_id);
                    document.getElementById("searchInput").value = "";
                    document.getElementById("results").innerHTML = "";
                    fetchMySongs();
                    showToast("ส่งคำขอเพลงแล้ว!", "success");
                } else {
                    showToast(data.error || "เพิ่มเพลงไม่สำเร็จ", "error");
                    // If blocked, remove that song from UI
                    if ((data.error||"").includes("เล่นไม่ได้")) {
                        // find and hide the song card that was clicked — toast is enough
                    }
                    console.error("Add song failed:", data);
                }
            })
            .catch(err => {
                console.error("Request error:", err);
                const msg = err.message || "";
                if (msg.includes("เล่นไม่ได้") || msg.includes("อยู่ในคิว") || msg.includes("ครบ 5") || msg.includes("เร็วเกิน") || msg.includes("กรุณาใส่")) {
                    showToast(msg, "error");
                } else if (msg.includes("HTTP")) {
                    showToast("เกิดข้อผิดพลาด ลองใหม่นะ", "error");
                } else {
                    showToast("เกิดข้อผิดพลาด ลองใหม่นะ", "error");
                }
            });
        }

        let mySongId = null;

        function showResult(songId) {
            mySongId = songId;
            document.getElementById("result-panel").classList.remove("hidden");
            updateMyStatus();
        }

        function updateMyStatus() {
            if (!mySongId) return;
            fetch("/api/queue/")
                .then(res => res.json())
                .then(data => {
                    const idx = data.queue.findIndex(s => s.id === mySongId);
                    const text = document.getElementById("result-text");
                    if (idx === -1) {
                        text.innerHTML = "เพลงของคุณเล่นแล้ว ขอบคุณที่ใช้บริการ!";
                        mySongId = null;
                    } else if (idx === 0) {
                        text.innerHTML = "กำลังเล่นเพลงของคุณ!";
                    } else {
                        text.innerHTML = "เพิ่มเพลงเข้าคิวแล้ว!<br>คิวของคุณ: ลำดับที่ " + (idx + 1);
                    }
                })
                .catch(err => console.error(err));
        }

        function fetchNowPlaying() {
            fetch("/api/queue/")
                .then(res => res.json())
                .then(data => {
                    const content = document.getElementById("now-playing-content");
                    if (data.queue && data.queue.length > 0) {
                        const song = data.queue[0];
                        content.innerHTML = `
                            <div class="flex items-center gap-3">
                                <img src="${song.thumbnail}" class="w-12 h-12 object-cover rounded-lg flex-shrink-0">
                                <div class="overflow-hidden">
                                    <p class="font-semibold text-sm truncate text-slate-900 dark:text-white">${escapeHtml(song.title)}</p>
                                    <p class="text-xs text-slate-500 dark:text-slate-300 truncate">${escapeHtml(song.channel)}</p>
                                </div>
                            </div>
                        `;
                    } else {
                        content.textContent = "ไม่มีเพลงในคิว";
                    }
                })
                .catch(err => console.error(err));
        }

        function fetchMySongs() {
            fetch("/api/my-songs/?client_id=" + encodeURIComponent(clientId))
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById("my-songs-list");
                    if (!data.songs || data.songs.length === 0) {
                        container.innerHTML = '<p class="text-xs text-slate-400 text-center py-3">ยังไม่มีเพลงที่ขอไว้</p>';
                        return;
                    }
                    container.innerHTML = "";
                    data.songs.forEach(song => {
                        container.innerHTML += `
                            <div class="bg-white dark:bg-slate-700 shadow-md p-3 rounded-xl border border-slate-200 dark:border-slate-600 flex items-center gap-3">
                                <img src="${song.thumbnail}" class="w-12 h-12 object-cover rounded-lg flex-shrink-0">
                                <div class="flex-1 overflow-hidden">
                                    <p class="font-semibold text-sm truncate text-slate-900 dark:text-white">${escapeHtml(song.title)}</p>
                                    <p class="text-xs text-slate-500 dark:text-slate-300 truncate">${escapeHtml(song.channel)}</p>
                                </div>
                                <button onclick="removeMySong(${song.id})"
                                        class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-lg font-bold text-xs shadow transition flex-shrink-0">
                                    ลบ
                                </button>
                            </div>
                        `;
                    });
                })
                .catch(err => console.error(err));
        }

        function removeMySong(songId) {
            if (!confirm("ลบเพลงนี้ออกจากคิว?")) return;
            fetch("/api/my-songs/" + songId + "/delete/", {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-CSRFToken": getCSRFToken() },
                credentials: 'same-origin',
                body: JSON.stringify({ client_id: clientId })
            })
            .then(res => res.json())
            .then(data => {
                fetchMySongs();
                fetchNowPlaying();
            })
            .catch(err => console.error(err));
        }

        document.addEventListener("DOMContentLoaded", function () {
            if (isLineWebView) {
                const b = document.getElementById('webview-banner');
                if (b) b.classList.remove('hidden');
            }
            renderHitList();
            fetchNowPlaying();
            fetchMySongs();
            fetchHits();
            setInterval(function () {
                fetchNowPlaying();
                fetchMySongs();
            }, 3000);
            setInterval(updateMyStatus, 3000);
            // Auto-refresh recommended songs every 60 seconds
            setInterval(fetchHits, 30000);
        });

        document.addEventListener("touchstart", function() {}, { once: true });
        document.addEventListener("click", function() {}, { once: true });

        let suggestTimer = null;

        searchInput.addEventListener("input", function () {
            clearTimeout(searchTimer);
            clearTimeout(suggestTimer);
            const q = this.value.trim();
            suggestTimer = setTimeout(() => fetchSuggestions(q), 300);
            searchTimer = setTimeout(searchSong, 500);
        });

        searchInput.addEventListener("keypress", function (e) {
            if (e.key === "Enter") { hideSuggestions(); searchSong(); }
        });

        searchInput.addEventListener("blur", () => setTimeout(hideSuggestions, 200));

        function showSuggestions(suggestions) {
            const container = document.getElementById("search-suggestions");
            if (!suggestions || suggestions.length === 0) {
                container.classList.add("hidden");
                return;
            }
            container.innerHTML = suggestions.map(s =>
                '<div class="px-3 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-amber-50 dark:hover:bg-slate-700 cursor-pointer border-b border-slate-100 dark:border-slate-700 last:border-0">' + escapeHtml(s) + '</div>'
            ).join("");
            container.classList.remove("hidden");
            // Bind click on each suggestion
            container.querySelectorAll("div").forEach(el => {
                el.addEventListener("mousedown", function(e) {
                    e.preventDefault();
                    document.getElementById("searchInput").value = this.textContent;
                    hideSuggestions();
                    searchSong();
                });
            });
        }

        function hideSuggestions() {
            const el = document.getElementById("search-suggestions");
            if (el) el.classList.add("hidden");
        }

        function fetchSuggestions(query) {
            if (!query || query.length < 2) { hideSuggestions(); return; }
            fetch("/api/suggest/?q=" + encodeURIComponent(query))
                .then(res => res.json())
                .then(data => { showSuggestions(data.suggestions || []); })
                .catch(() => hideSuggestions());
        }
    </script>
    <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 hidden bg-slate-900 text-white px-4 py-2 rounded-xl shadow-lg text-sm font-medium"></div>
    <script>
    function toggleTheme(){
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateThemeIcon();
    }
    function updateThemeIcon(){
      const btn=document.getElementById('theme-toggle');
      if(btn) btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    }
    (function(){
      const saved=localStorage.getItem('theme');
      if(saved==='dark') document.documentElement.classList.add('dark');
      updateThemeIcon();
    })();
    document.addEventListener('DOMContentLoaded', updateThemeIcon);
    </script>
    <script>
    if ('serviceWorker' in navigator && !isLineWebView) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register("{% static 'music/sw.js' %}").catch(()=>{});
        });
    }
    </script>
</body>
</html>
