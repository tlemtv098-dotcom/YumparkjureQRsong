<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embed Test</title>
<style>
body { font-family: system-ui, sans-serif; margin: 16px; }
.wrap { max-width: 720px; margin: 0 auto; }
</style>
</head>
<body>
<div class="wrap">
<h1>ทดสอบ Embed</h1>
<p>หน้านี้คือ iframe เปล่าๆ ไม่มีสคริปต์ ถ้าเล่นได้แต่หน้าหลัก error 153 แสดงว่าเป็นที่ player config ถ้าหน้านี้ก็ error แสดงว่าเป็นที่เครื่องหรือเน็ตเวิร์ก</p>
<iframe width="100%" height="360" src="https://www.youtube-nocookie.com/embed/ks7p6DA0dKk" frameborder="0" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
<h2>ส่วนที่ 2: YT.Player API มินิมอล</h2>
<div id="api-player"></div>
<button id="api-play-btn">โหลดและเล่น</button>
<p id="api-error"></p>
<h2>ส่วนที่ 3: สร้างพร้อม videoId</h2>
<div id="prefilled-player"></div>
<button id="prefilled-play-btn">เล่น</button>
<p id="prefilled-error"></p>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
let apiPlayer=null; let prefilledPlayer=null; function onYouTubeIframeAPIReady(){ apiPlayer = new YT.Player('api-player',{height:'360',width:'100%',host:'https://www.youtube-nocookie.com',playerVars:{'controls':1,'origin':window.location.origin,'enablejsapi':1},events:{'onError':(e)=>{document.getElementById('api-error').textContent='Error: '+e.data;}}}); prefilledPlayer = new YT.Player('prefilled-player', {height:'360', width:'100%', host:'https://www.youtube-nocookie.com', videoId:'ks7p6DA0dKk', playerVars:{'controls':1,'origin':window.location.origin,'enablejsapi':1}, events:{'onError':(e)=>{document.getElementById('prefilled-error').textContent='Error: '+e.data;}}}); } document.getElementById('api-play-btn').addEventListener('click',()=>{ if(apiPlayer){ apiPlayer.loadVideoById('ks7p6DA0dKk'); apiPlayer.playVideo(); } }); document.getElementById('prefilled-play-btn').addEventListener('click',()=>{ if(prefilledPlayer){ prefilledPlayer.playVideo(); } });
</script>
</div>
</body>
</html>
